<!doctype html>
<meta charset="utf-8">
<!-- Banner for content/blog/end_of_app_switching_ai_workspaces.md.
     Figures: Harvard Business Review, "How Much Time and Energy Do We Waste
     Toggling Between Applications?", August 2022. Keep in sync with the post.
     Render at 1920x1080 (2x) with Playwright, then cwebp -resize 1920 0. -->
<style>
  @font-face{font-family:"Plus Jakarta Sans";font-weight:300 800;
    src:url(../../static/fonts/plus-jakarta-sans-latin.woff2) format("woff2")}
  @font-face{font-family:"JetBrains Mono";font-weight:400 600;
    src:url(../../static/fonts/jetbrains-mono-latin.woff2) format("woff2")}
  :root{
    --bg:#080b12;
    --accent:#5b9dff;        /* brand blue, lifted for the dark ground */
    --white:#ffffff;
    --muted:#9aa4b6;
    --dim:#6b7486;
    --line:rgba(255,255,255,.075);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow:hidden}
  body{width:1920px;height:1080px;background:var(--bg);position:relative;
       font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 85% 70% at 60% 45%,#000 30%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 85% 70% at 60% 45%,#000 30%,transparent 100%)}

  .wrap{position:relative;height:100%;display:flex;align-items:center;gap:88px;
        padding:0 112px}

  /* left: headline */
  .left{flex:1}
  h1{font-size:128px;line-height:1.02;font-weight:800;color:var(--white);letter-spacing:-.03em}
  h1 .accent{color:var(--accent)}
  .sub{margin-top:40px;font-size:44px;line-height:1.3;font-weight:500;color:var(--muted);
       max-width:880px}

  .brand{position:absolute;left:112px;bottom:64px;font-size:26px;color:var(--dim);font-weight:500}
  .brand b{color:var(--muted);font-weight:700}

  /* right: the three numbers */
  .board{width:620px;flex:none;background:rgba(255,255,255,.035);
         border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:40px 44px 20px}
  .board-t{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:500;
           color:var(--muted);padding-bottom:26px;border-bottom:1px solid rgba(255,255,255,.1)}
  .r{padding:28px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .r:last-child{border-bottom:0}
  .n{font-size:84px;font-weight:800;color:var(--white);letter-spacing:-.03em;line-height:1}
  .n .u{font-size:44px;font-weight:700;color:var(--muted);margin-left:14px;letter-spacing:-.01em}
  .c{margin-top:12px;font-size:30px;line-height:1.3;color:var(--muted);font-weight:500}
</style>

<div class="grid"></div>

<div class="wrap">
  <div class="left">
    <h1>The end of<br>app <span class="accent">switching</span></h1>
    <p class="sub">Why teams are moving from tool stacks to one AI workspace</p>
  </div>

  <div class="board">
    <div class="board-t">HBR study, 137 workers, 2022</div>
    <div class="r">
      <div class="n">1,200</div>
      <div class="c">switches a day, 2 seconds each</div>
    </div>
    <div class="r">
      <div class="n">~4<span class="u">hours</span></div>
      <div class="c">a week spent reorienting</div>
    </div>
    <div class="r">
      <div class="n">9%</div>
      <div class="c">of the working year, about 5 weeks</div>
    </div>
  </div>
</div>

<div class="brand"><b>pinggy.io</b> / blog</div>
