{{ define "main" }}
<article class="kyp">
  <header>
    {{ with .Parent }}<a class="kyp-eyebrow" href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
    {{ partial "kyp-title.html" . }}
    <p class="kyp-meta">
      {{ if ne .Lastmod .Date }}
      {{ i18n "updatedOn" }} {{ time.Format (i18n "datefmtAmp") .Lastmod }}
      {{ else }}
      {{ time.Format (i18n "datefmtAmp") .Date }}
      {{ end }}
    </p>
  </header>

  <div class="kyp-body">{{ .Content }}</div>
</article>
{{ end }}
