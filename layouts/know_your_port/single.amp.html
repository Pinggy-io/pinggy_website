{{ define "main" }}
<h1 class="blogtitle">{{.Title}}</h1>

<div class="blogbody">
  {{ if ne .Lastmod .Date }}
  <span class="info">
    <br />
    {{ i18n "updatedOn" }} {{ time.Format (i18n "datefmtAmp") .Lastmod }}</span
  >
  {{ else }}
  <span class="info">{{ time.Format (i18n "datefmtAmp") .Date }}</span>
  {{ end }}
</div>

<div class="blogbody">{{ .Content }}</div>
{{ end }}
