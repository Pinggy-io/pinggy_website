{{ define "main" }}

<h1 class="display-3 mb-4">{{.Title}}</h1>

<div class="row justify-content-center">
  <div class="col-12 col-md-12">
    <div class="row">
      <div class="col col-12 col-lg-6">
        {{ if ne .Lastmod .Date }}
        <span class="date-info italic">
          <br />
          {{ i18n "updatedOn" }} {{ time.Format (i18n "datefmtAmp") .Lastmod }}</span
        >
        {{ else }}
        <i class="bi bi-calendar4-event me-1"></i
        ><span>{{ time.Format (i18n "datefmtAmp") .Date }}</span>
        {{ end }}
      </div>
    </div>

    <hr class="mt-3" />
    <div class="col-12 col-lg-12">{{ .Content}}</div>
  </div>
</div>
{{ end }} {{ define "pagespecificjs" }} {{ end }}
