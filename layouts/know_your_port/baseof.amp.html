<!DOCTYPE html>
<html ⚡ lang="{{ site.Language.Lang }}">
  <head>
    <meta charset="utf-8" />
    <title>
      {{ if .IsHome }}Pinggy - Simple Localhost Tunnels{{ else }}{{ if
      .Page.Title }}{{ .Page.Title }} - {{.Site.Title}}{{ end }}{{ end }}
    </title>

    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="/assets/favicon2.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="viewport"
      content="width=device-width,minimum-scale=1,initial-scale=1"
    />
    <style amp-boilerplate>
      body {
        -webkit-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
        -moz-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
        -ms-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
        animation: -amp-start 8s steps(1, end) 0s 1 normal both;
      }
      @-webkit-keyframes -amp-start {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
      @-moz-keyframes -amp-start {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
      @-ms-keyframes -amp-start {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
      @-o-keyframes -amp-start {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
      @keyframes -amp-start {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
    </style>
    <style amp-custom>
      body {
        font-family: "Inter", sans-serif;
      }
      header {
        background-color: #f8f9fa;
        padding: 1rem 0;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .navbar {
        display: flex;
        align-items: center;
        padding: 0 3rem;
      }
      .navbar .logo img {
        max-height: 60px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 1rem;
      }
      .blogcontent p {
        hyphens: auto;
      }
      .blogcontent a {
        hyphens: auto;
        word-break: break-all;
        text-decoration: none;
      }
      .blogtitle {
        font-size: 3rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .blogbody {
        text-align: justify;
      }
      .blogbody p,
      .blogbody li {
        line-height: 1.7rem;
      }
      .blogbody a {
        color: #5a67d8;
      }
      .blogbody pre {
        white-space: pre-wrap;
      }
      .blogbody code {
        font-size: 1rem;
        color: #991313;
      }
      /* `height: auto` is what keeps the aspect ratio. The shortcodes stamp
         the intrinsic width/height on the tag so the browser can reserve the
         box, but those attributes also set a used height, so without this the
         width shrank to the column while the height stayed at the full
         intrinsic value - a 1280x720 banner rendered 800x720 on desktop and
         358x720 on a phone. With `height: auto` the attributes go back to
         supplying only the ratio, which is what `.bp img` does on the HTML
         page. `border-box` stops the padding from being added on top of
         `max-width: 100%`, which pushed the image ~26px past the column and
         gave the page a horizontal scroll on mobile. Note that border-box also
         reinterprets the handful of images carrying an inline `width` in em
         (seven of them, all in host_website_on_android): that em value is now
         the total footprint rather than the picture, so those render 1.6em
         narrower - 454px instead of 480px. Aspect ratio stays correct. */
      .blogcontent img {
        box-sizing: border-box;
        max-width: 100%;
        height: auto;
        padding: 1em 0.8em;
        border-radius: 1%;
      }
      .blogbody h2 {
        font-weight: 500;
        margin-top: 2rem;
      }
      .blogbody h3 {
        font-weight: 500;
        margin-top: 1.5rem;
      }
      .info {
        font-size: 1.25rem;
        color: #666;
      }
      /* `flex-wrap: wrap` because the default `nowrap` gave the tag row no
         way out on a narrow screen: a 12-tag post ran the row to 915px inside
         a 390px viewport and scrolled the whole page sideways, and even a
         5-tag post squeezed the pills until the text broke onto a second line
         inside them ("KVM Over IP" rendered 36px tall against 22px for the
         one-line pills). `white-space: nowrap` on the pill keeps each tag on a
         single line so it wraps as a unit rather than mid-label. */
      .badge-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: center;
        gap: 0.5rem;
        margin: 0.5rem 0;
      }
      .badge {
        color: #fff;
        padding: 0.25rem 0.5rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        background-color: #6c757d;
        white-space: nowrap;
      }
      footer {
        padding: 2rem 1rem;
        background-color: #101214;
      }
      .footer {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        color: #fff;
        font-size: 0.875rem;
      }
      .footer a {
        color: #fff;
        text-decoration: none;
      }
      @media (max-width: 768px) {
        .navbar {
          padding: 0 0.5rem;
        }
        .blogtitle {
          font-size: 2rem;
          margin-bottom: 0.25rem;
        }
      }
      /* Know Your Ports. Literal-value copy of the kyp-* rules in
         assets/css/customization.css (AMP pages don't load that file). */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      .kyp { padding: 32px 0 64px; color: #374151; }
      .kyp-eyebrow {
        display: inline-block;
        margin-bottom: 16px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b7280;
        text-decoration: none;
      }
      .kyp-title {
        margin: 0;
        color: #0b0f19;
        font-size: 2.25rem;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.025em;
      }
      .kyp-title__port {
        display: inline-block;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-weight: 600;
        letter-spacing: -0.04em;
        color: inherit;
        text-decoration: none;
        word-break: normal;
      }
      .kyp-title__port::after {
        content: "\2197";
        margin-left: 0.1em;
        font-family: "Inter", sans-serif;
        font-size: 0.4em;
        font-weight: 500;
        vertical-align: 1.2em;
        color: #9ca3af;
        opacity: 0.6;
      }
      .kyp-title__rest {
        display: block;
        margin-top: 12px;
        font-size: 1.25rem;
        font-weight: 500;
        line-height: 1.5;
        color: #6b7280;
      }
      .kyp-meta { margin: 16px 0 32px; font-size: 0.875rem; color: #6b7280; }
      .kyp-body { font-size: 1rem; line-height: 1.6; }
      .kyp-body p,
      .kyp-body ul { margin: 0 0 16px; }
      .kyp-body h2 {
        margin: 48px 0 16px;
        font-size: 1.5rem;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.015em;
        color: #111827;
      }
      .kyp-body h3 {
        margin: 0 0 8px;
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.4;
        color: #111827;
      }
      .kyp-body hr { margin: 48px 0; border: 0; border-top: 1px solid #e5e7eb; }
      .kyp-body hr + h2 { margin-top: 0; }
      .kyp-body strong { font-weight: 600; color: #111827; }
      .kyp-body a { color: #3b6fe0; word-break: normal; text-decoration: underline; }
      .kyp-body code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #f1f3f7;
        color: #111827;
        font-size: 0.875em;
      }
      .kyp-body pre {
        padding: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        background: #f7f8fa;
        overflow-x: auto;
      }
      .kyp-hero,
      .kyp-card,
      .kyp-problems {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
      }
      .kyp-hero { margin: 0 0 32px; padding: 20px; }
      .kyp-hero > * { margin: 0; }
      .kyp-hero__port { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.875rem; color: #6b7280; }
      .kyp-hero__sub { margin-top: 4px; font-size: 1.125rem; font-weight: 600; color: #111827; }
      .kyp-hero__note { margin-top: 4px; font-size: 0.875rem; color: #6b7280; }
      .kyp-body a.kyp-hero__btn {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 10px;
        background: #3b6fe0;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
      .kyp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 24px 0 32px; }
      .kyp-card { padding: 24px; }
      .kyp-card h3 { margin-bottom: 12px; }
      .kyp-card ul { margin: 0; padding: 0; list-style: none; font-size: 0.9375rem; }
      .kyp-card li { padding: 10px 0; border-top: 1px solid #f1f3f7; }
      .kyp-card li:first-child { padding-top: 0; border-top: 0; }
      .kyp-step {
        position: relative;
        margin: 0 0 0 6px;
        padding: 0 0 32px 28px;
        border-left: 1px solid #e5e7eb;
        font-size: 0.9375rem;
      }
      .kyp-step::before {
        content: "";
        position: absolute;
        top: 7px;
        left: -6px;
        width: 11px;
        height: 11px;
        border: 2px solid #d1d5db;
        border-radius: 999px;
        background: #fff;
        box-sizing: border-box;
      }
      .kyp-step p { margin-bottom: 4px; }
      .kyp-step ul { margin: 8px 0 0; padding-left: 20px; }
      .kyp-problems { margin: 24px 0 32px; overflow: hidden; }
      .kyp-problem { padding: 20px 24px; font-size: 0.9375rem; }
      .kyp-problem + .kyp-problem { border-top: 1px solid #e5e7eb; }
      .kyp-problem p { margin-bottom: 4px; }
      .kyp-quick {
        margin: 48px 0 32px;
        background: #0e1116;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        overflow: hidden;
      }
      .kyp-body .kyp-quick h3 {
        margin: 0;
        padding: 8px 20px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        font-size: 0.8125rem;
        font-weight: 500;
        color: #6b7280;
      }
      .kyp-quick__code { padding: 20px 24px; overflow-x: auto; }
      .kyp-body .kyp-quick__code code {
        display: block;
        padding: 0;
        background: transparent;
        color: #e5e7eb;
        font-size: 0.875rem;
        line-height: 1.7;
      }
      .kyp-body .kyp-quick__note {
        margin: 0;
        padding: 12px 24px;
        background: #fff;
        border-top: 1px solid #e5e7eb;
        font-size: 0.875rem;
        color: #6b7280;
      }
    </style>
    <noscript
      ><style amp-boilerplate>
        body {
          -webkit-animation: none;
          -moz-animation: none;
          -ms-animation: none;
          animation: none;
        }
      </style></noscript
    >
    <script async src="https://cdn.ampproject.org/v0.js"></script>
    <script
      async
      custom-element="amp-video"
      src="https://cdn.ampproject.org/v0/amp-video-0.1.js"
    ></script>
    <script
      async
      custom-element="amp-iframe"
      src="https://cdn.ampproject.org/v0/amp-iframe-0.1.js"
    ></script>
    {{- with .OutputFormats.Get "HTML" }}
    <link rel="canonical" href="{{ .RelPermalink | absURL }}" />
    {{- end }}

    <script async custom-element="amp-analytics"
    src="https://cdn.ampproject.org/v0/amp-analytics-0.1.js">
    </script>
  </head>

  <body>
    <amp-analytics type="gtag" data-credentials="include">
      <script type="application/json">
      {
        "vars" : {
          "gtag_id": "G-XSXMV79JL3",
          "config" : {
            "G-XSXMV79JL3": { "groups": "default" }
          }
        }
      }
      </script>
    </amp-analytics>
    <header>
      <nav class="navbar">
        <div class="logo">
          <a href="/">
            <img
              src="/assets/pinggy_logo.webp"
              alt="Pinggy brand logo"
              height="50"
            />
          </a>
        </div>
      </nav>
    </header>
    <main class="container">
      <div class="blogcontent">{{- block "main" . }}{{- end }}</div>
    </main>
    <footer>
      <div class="footer">
        <a href="/contact_us/">Contact Us</a>
        <span class="mx-2 text-secondary">•</span>
        <a href="/terms_of_service/">Terms of Service</a>
        <span class="mx-2 text-secondary">•</span>
        <a href="/privacy_policy/">Privacy Policy</a>
        <span class="mx-2 text-secondary">•</span>
        <a href="/about/">About Us</a>
      </div>
    </footer>
  </body>
</html>
