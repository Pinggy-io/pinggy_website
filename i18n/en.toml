# UI strings for the blog and know-your-port templates. Keys are referenced
# with {{ i18n "key" }}.
# `datefmt*` values are Go time layouts rendered through `time.Format`, which
# localises month and weekday names - so the layout itself carries any
# language-specific wording (e.g. Spanish "2 de January de 2006").
#
# NOTE: Hugo's i18n TOML reserves the keys `one` and `other`. Never introduce a
# [table] into this file - it swallows every key defined after it and fails the
# build with "reserved keys mixed with unreserved keys".

