# Spanish UI strings. Mirrors i18n/en.toml key for key - any key missing here
# falls back to the English value.
# `datefmt*` are Go time layouts: `time.Format` localises the month name, so the
# surrounding wording ("de ... de") lives in the layout string itself.
#
# NOTE: Hugo's i18n TOML reserves the keys `one` and `other`. Never introduce a
# [table] into this file - it swallows every key defined after it and fails the
# build with "reserved keys mixed with unreserved keys".

# Dates
datefmt = "2 de January de 2006"
datefmtShort = "Mon, 2 Jan 2006"
datefmtAmp = "2 Jan 2006"

