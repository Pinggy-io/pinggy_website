baseURL: "https://pinggy.io"
title: "Pinggy"

# Multilingual: English is the default and stays at the site root, so every
# existing /blog/... URL is unchanged. Spanish lives under /es/ and covers the
# blog only - a post becomes bilingual by adding a sibling `<name>.es.md`.
# Taxonomy/term/RSS are off for Spanish because tags are not translated; the
# Spanish home is kept on and serves a dedicated landing page.
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    locale: en
    label: "English"
    weight: 1
    params:
      ogLocale: "en_US"
  es:
    locale: es
    label: "Español"
    weight: 2
    disableKinds: ["taxonomy", "term", "rss"]
    params:
      ogLocale: "es_ES"

markup:
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    hl_inline: false
    lineAnchors: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    noHl: false
    style: manni
    tabWidth: 4
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  tag: tags

pagination:
  pagerSize: 10

outputs:
  home: ["HTML", "AMP", "llmstxt"]
  page: ["HTML", "AMP"]

outputFormats:
  HTML:
    mediaType: "text/html"
    baseName: "index"
    isPlainText: false

  AMP:
    isPlainText: false
    mediaType: "text/html"
    path: "amp"
    permalinkable: true

  Markdown:
    mediaType: "text/markdown"
    baseName: "index"
    isPlainText: true
    path: ""

  llmstxt:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    rel: "alternate"

menus:
  main:
    - name: Home
      url: "/"
      weight: 90
    - name: Pricing
      url: /#prices
      weight: 100
    - name: Docs
      url: /docs/
      weight: 120
    - name: Download
      url: /app/
      weight: 123
    - name: Compare
      url: /compare/
      weight: 125
    - name: Quickstart
      url: /quickstart/
      weight: 130
    - name: Blog
      url: /blog/
      weight: 140
    - name: Help
      url: /help/
      weight: 150
  # - name: Terms of Service
  #   url: /Terms_of_Service
  #   weight: 110
  # - name: Cancellation and Return Policy
  #   url: /Return_policy
  #   weight: 120

minify:
  minifyOutput: true
  tdewolff:
    html:
      keepQuotes: true
